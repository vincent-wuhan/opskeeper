id: pg/slow-query
description: 模拟 PG 慢查询风暴（pg_stat_statements 命中 Top N）
severity: P2
tags: [pg, slow-query, performance]
prerequisites:
  - pg.cluster reachable
  - pg.bench dataset loaded
inject:
  - type: pg.run_slow_queries
    duration: 180s
    params:
      query: "SELECT * FROM orders o JOIN order_items oi ON o.id = oi.order_id WHERE o.created_at > NOW() - INTERVAL '7 days'"
      concurrent: 50
      mean_duration_ms: 2000
expect:
  time_to_detect: 90
  time_to_remediate: 240
  root_cause_lines:
    - pg.top_queries_by_time
    - pg.top_queries_by_calls
    - pg.explain_query
  remediation_options:
    - pg.explain_query
    - pg.kill_session
rubric:
  rca_accuracy: 0.85
  time_to_remediate: 240
  no_collateral_damage: true
metadata:
  owner: "@opskeeper-oncall"
  created_at: "2026-07-13"
