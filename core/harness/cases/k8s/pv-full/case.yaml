id: k8s/pv-full
description: 模拟 K8s PersistentVolume 容量满
severity: P2
tags: [k8s, pv, storage]
prerequisites:
  - k8s.cluster reachable
  - k8s.test_namespace exists
inject:
  - type: k8s.fill_pv
    duration: 600s
    params:
      namespace: test
      pvc: data-pvc
      fill_percent: 99
expect:
  time_to_detect: 120
  time_to_remediate: 300
  root_cause_lines:
    - k8s.events
    - k8s.pod_list
  remediation_options:
    - k8s.resize_pvc
    - k8s.cleanup_logs
rubric:
  rca_accuracy: 0.8
  time_to_remediate: 300
  no_collateral_damage: true
metadata:
  owner: "@opskeeper-oncall"
  created_at: "2026-07-13"
