id: k8s/node-notready
description: 模拟 K8s Node 进入 NotReady 状态
severity: P1
tags: [k8s, node, ha]
prerequisites:
  - k8s.cluster reachable
  - k8s.test_namespace exists
inject:
  - type: k8s.cordon_node
    duration: 600s
    params:
      target_node: worker-3
      simulate_network_partition: true
expect:
  time_to_detect: 60
  time_to_remediate: 180
  root_cause_lines:
    - k8s.node_list
    - k8s.events
    - k8s.pod_list
  remediation_options:
    - k8s.uncordon
    - k8s.drain
rubric:
  rca_accuracy: 0.85
  time_to_remediate: 180
  no_collateral_damage: true
metadata:
  owner: "@opskeeper-oncall"
  created_at: "2026-07-13"
