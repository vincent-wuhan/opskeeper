id: k8s/deployment-failed
description: 模拟 K8s Deployment 滚动升级失败（ImagePullBackOff）
severity: P2
tags: [k8s, deployment, image-pull]
prerequisites:
  - k8s.cluster reachable
  - k8s.test_namespace exists
inject:
  - type: k8s.set_bad_image
    duration: 600s
    params:
      namespace: test
      deployment: order-svc
      image: registry.invalid/order-svc:v0.0.0
expect:
  time_to_detect: 60
  time_to_remediate: 120
  root_cause_lines:
    - k8s.deployment_status
    - k8s.events
    - k8s.describe_pod
  remediation_options:
    - k8s.rollout_undo
rubric:
  rca_accuracy: 0.9
  time_to_remediate: 120
  no_collateral_damage: true
metadata:
  owner: "@opskeeper-oncall"
  created_at: "2026-07-13"
