id: redis/hot-key
description: 模拟 Redis 热 key（单 key QPS > 10w 导致倾斜）
severity: P2
tags: [redis, hot-key, skew]
prerequisites:
  - redis.cluster reachable
inject:
  - type: redis.inject_hot_key
    duration: 600s
    params:
      key: "session:active:user_42"
      qps: 100000
      concurrent_clients: 200
expect:
  time_to_detect: 120
  time_to_remediate: 300
  root_cause_lines:
    - redis.hot_keys
    - redis.client_list
  remediation_options:
    - redis.scan_and_redistribute
rubric:
  rca_accuracy: 0.85
  time_to_remediate: 300
  no_collateral_damage: true
metadata:
  owner: "@opskeeper-oncall"
  created_at: "2026-07-13"
