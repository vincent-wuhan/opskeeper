id: redis/memory-burst
description: 模拟 Redis 内存爆（maxmemory 触发驱逐风暴）
severity: P1
tags: [redis, memory, eviction]
prerequisites:
  - redis.cluster reachable
inject:
  - type: redis.inject_memory_burst
    duration: 300s
    params:
      maxmemory_mb: 1024
      fill_percent: 99
expect:
  time_to_detect: 60
  time_to_remediate: 180
  root_cause_lines:
    - redis.memory_usage
    - redis.fragmentation_ratio
    - redis.info
  remediation_options:
    - redis.config_set
    - redis.flushdb
# zero-manual-ops-loop Day 7 task 7.3: rubric 升级 4 指标
rubric:
  rca_accuracy: 0.85
  time_to_remediate: 180
  approval_rate: 1.0
  recovery_pass_rate: 1.0
  no_collateral_damage: true
metadata:
  owner: "@opskeeper-oncall"
  created_at: "2026-07-13"
