id: host/disk-full
description: 模拟主机磁盘满（>95%）
severity: P1
tags: [host, disk, capacity]
prerequisites:
  - host.test_user_ssh_accessible
inject:
  - type: host.fill_disk
    duration: 300s
    params:
      path: /tmp/test-fill
      target_percent: 96
expect:
  time_to_detect: 60
  time_to_remediate: 180
  root_cause_lines:
    - host.host_load
    - host.host_files
    - host.host_processes
  remediation_options:
    - host.remove_old_logs
rubric:
  rca_accuracy: 0.9
  time_to_remediate: 180
  no_collateral_damage: true
metadata:
  owner: "@opskeeper-oncall"
  created_at: "2026-07-13"
