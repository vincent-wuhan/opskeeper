id: mq/rabbitmq-backlog
description: 模拟 RabbitMQ 消息堆积导致 consumer lag
severity: P2
tags: [rabbitmq, backlog, consumer-lag]
prerequisites:
  - rabbitmq.cluster reachable
inject:
  - type: rabbitmq.inject_message_burst
    duration: 600s
    params:
      queue: order.events
      message_count: 100000
      message_size_bytes: 1024
      publish_rate: 5000
expect:
  time_to_detect: 120
  time_to_remediate: 600
  root_cause_lines:
    - rabbitmq.queue_list
    - rabbitmq.queue_depth
    - rabbitmq.consumer_status
  remediation_options:
    - rabbitmq.purge_queue
    - rabbitmq.scale_consumer
rubric:
  rca_accuracy: 0.85
  time_to_remediate: 600
  no_collateral_damage: true
metadata:
  owner: "@opskeeper-oncall"
  created_at: "2026-07-13"
