id: mq/kafka-consumer-lag
description: 模拟 Kafka consumer lag 累积（消费速度跟不上生产）
severity: P2
tags: [kafka, consumer-lag]
prerequisites:
  - kafka.cluster reachable
inject:
  - type: kafka.inject_consumer_lag
    duration: 600s
    params:
      topic: order.events
      consumer_group: order-svc
      produce_rate: 5000
      consume_rate: 1000
expect:
  time_to_detect: 120
  time_to_remediate: 300
  root_cause_lines:
    - kafka.consumer_lag
    - kafka.partition_skew
  remediation_options:
    - kafka.scale_consumer
rubric:
  rca_accuracy: 0.85
  time_to_remediate: 300
  no_collateral_damage: true
metadata:
  owner: "@opskeeper-oncall"
  created_at: "2026-07-13"
