server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $agentteams_controller http://agentteams-controller:6167;

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /version {
        add_header Cache-Control "no-cache";
    }

    location /config {
        add_header Cache-Control "no-cache";
    }

    location /.well-known/matrix/ {
        proxy_pass $agentteams_controller;
    }

    location /_matrix/ {
        proxy_pass $agentteams_controller;
    }
}
