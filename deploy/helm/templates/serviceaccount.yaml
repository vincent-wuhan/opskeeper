{{- if .Values.rbac.create }}
apiVersion: v1
kind: List
metadata:
  name: {{ include "opskeeper.fullname" . }}-rbac
items:
  - apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: {{ include "opskeeper.fullname" . }}-manager
      labels:
        {{- include "opskeeper.labels" . | nindent 8 }}
  - apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: {{ include "opskeeper.fullname" . }}-edge-agent
      labels:
        {{- include "opskeeper.labels" . | nindent 8 }}
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRole
    metadata:
      name: {{ include "opskeeper.fullname" . }}-manager
      labels:
        {{- include "opskeeper.labels" . | nindent 8 }}
    rules:
      # 路径 A 集成：K8s Adapter 需要 K8s 资源操作权限
      - apiGroups: [""]
        resources: ["pods", "services", "nodes", "configmaps", "events", "namespaces"]
        verbs: ["get", "list", "watch"]
      - apiGroups: ["apps"]
        resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
        verbs: ["get", "list", "watch"]
      # 写操作需独立审批（cmdpolicy + Casbin 双层）
      - apiGroups: ["apps"]
        resources: ["deployments/scale"]
        verbs: ["get", "list", "watch", "patch"]
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRoleBinding
    metadata:
      name: {{ include "opskeeper.fullname" . }}-manager
      labels:
        {{- include "opskeeper.labels" . | nindent 8 }}
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: ClusterRole
      name: {{ include "opskeeper.fullname" . }}-manager
    subjects:
      - kind: ServiceAccount
        name: {{ include "opskeeper.fullname" . }}-manager
        namespace: {{ .Release.Namespace }}
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: Role
    metadata:
      name: {{ include "opskeeper.fullname" . }}-edge-agent
      labels:
        {{- include "opskeeper.labels" . | nindent 8 }}
    rules:
      # Edge agent 仅需本 namespace 资源
      - apiGroups: [""]
        resources: ["pods", "nodes", "configmaps"]
        verbs: ["get", "list", "watch"]
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: RoleBinding
    metadata:
      name: {{ include "opskeeper.fullname" . }}-edge-agent
      labels:
        {{- include "opskeeper.labels" . | nindent 8 }}
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: Role
      name: {{ include "opskeeper.fullname" . }}-edge-agent
    subjects:
      - kind: ServiceAccount
        name: {{ include "opskeeper.fullname" . }}-edge-agent
        namespace: {{ .Release.Namespace }}
{{- end }}
