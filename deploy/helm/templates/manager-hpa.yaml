{{- if .Values.manager.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "opskeeper.fullname" . }}-manager
  labels:
    {{- include "opskeeper.labels" . | nindent 4 }}
    app.kubernetes.io/component: manager
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "opskeeper.fullname" . }}-manager
  minReplicas: {{ .Values.manager.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.manager.autoscaling.maxReplicas }}
  metrics:
    {{- if .Values.manager.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.manager.autoscaling.targetCPUUtilizationPercentage }}
    {{- end }}
{{- end }}
