id: mq/partition-skew
description: 模拟 Kafka 分区倾斜（部分 partition 流量过高）
severity: P2
tags: [kafka, partition-skew, hot-partition]
prerequisites:
  - kafka.cluster reachable
inject:
  - type: kafka.inject_partition_skew
    duration: 600s
    params:
      topic: order.events
      skew_factor: 10
      target_partition: 0
expect:
  time_to_detect: 180
  time_to_remediate: 300
  root_cause_lines:
    - kafka.partition_skew
    - kafka.broker_skew
  remediation_options:
    - kafka.repartition
rubric:
  rca_accuracy: 0.85
  time_to_remediate: 300
  no_collateral_damage: true
metadata:
  owner: "@opskeeper-oncall"
  created_at: "2026-07-13"
