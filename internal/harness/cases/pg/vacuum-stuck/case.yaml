id: pg/vacuum-stuck
description: 模拟 PG VACUUM 卡住（长事务阻止清理）
severity: P3
tags: [pg, vacuum, long-tx]
prerequisites:
  - pg.cluster reachable
inject:
  - type: pg.hold_old_txn
    duration: 900s
    params:
      xmin: 100
  - type: pg.run_autovacuum
    duration: 600s
    params:
      table: orders
expect:
  time_to_detect: 300
  time_to_remediate: 600
  root_cause_lines:
    - pg.long_running_txns
    - pg.vacuum_status
  remediation_options:
    - pg.kill_session
    - pg.vacuum_table
rubric:
  rca_accuracy: 0.8
  time_to_remediate: 600
  no_collateral_damage: true
metadata:
  owner: "@opskeeper-oncall"
  created_at: "2026-07-13"
