id: pg/table-bloat
description: 模拟 PG 表膨胀（频繁 UPDATE 不 VACUUM）
severity: P3
tags: [pg, bloat, vacuum]
prerequisites:
  - pg.cluster reachable
  - pg.bench dataset loaded
inject:
  - type: pg.inject_table_bloat
    duration: 600s
    params:
      table: order_events
      update_count: 100000
      vacuum_disabled: true
expect:
  time_to_detect: 180
  time_to_remediate: 300
  root_cause_lines:
    - pg.table_bloat
    - pg.vacuum_status
    - pg.index_usage
  remediation_options:
    - pg.vacuum_table
rubric:
  rca_accuracy: 0.8
  time_to_remediate: 300
  no_collateral_damage: true
metadata:
  owner: "@opskeeper-oncall"
  created_at: "2026-07-13"
