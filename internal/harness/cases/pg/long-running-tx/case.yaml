id: pg/long-running-tx
description: 模拟 PG 长事务导致表膨胀和锁等待链
severity: P2
tags: [pg, transaction, bloat, lock]
prerequisites:
  - pg.cluster reachable
  - pg.bench dataset loaded
inject:
  - type: pg.begin_txn_hold
    duration: 300s
    params:
      isolation: repeatable-read
      tables: [orders]
      lock_count: 5
expect:
  time_to_detect: 60
  time_to_remediate: 180
  root_cause_lines:
    - pg.long_running_txns
    - pg.lock_waits
    - pg.table_bloat
  remediation_options:
    - pg.kill_session
# zero-manual-ops-loop Day 7 task 7.3: rubric 升级 4 指标
# (loop-harness-rubric spec delta + harness-eval-platform spec delta).
# Fields align with runner.LoopRubric JSON shape.
rubric:
  rca_accuracy: 0.9
  time_to_remediate: 180
  approval_rate: 1.0
  recovery_pass_rate: 1.0
  no_collateral_damage: true
metadata:
  owner: "@opskeeper-oncall"
  created_at: "2026-07-13"
  source: opskeeper-harness-port


# opskeeper-teamharness AgentTeams 集成扩展（2026-08-25）
# 参考：
#   - openspec/changes/agentteams-opskeeper-integration/proposal.md D6
#   - docs/superpowers/decisions/2026-08-25-opskeeper-as-agentteams-plugin.md
#   - plugins/opskeeper-teamharness/skills/team/opskeeper-coordination/SKILL.md
#
# 端到端验证：6 Worker (alerter → investigator → critic → reviewer → repairer → verifier)
# 按 SKILL 决策表派活，state.json 推进 6 阶段。
#
# ⚠️ 注意：本 case 调用的是 plugin 端友好命名空间（type.method），由 plugin
# stdio MCP server (mcp/names.py NAME_REMAP) 改写到 backend 实际工具名。
#   - postgres.long_running_tx → postgres.analyze_status → backend analyze_database_status
#   - pg.kill_session          → plugin 不暴露，走 backend 既有 webhook
#   - host.restart_service     → 透传到 backend
#   - state.put                → 走 /v1/state/{task_id} REST
agentteams:
  plugin: opskeeper-teamharness 1.0.0
  runtime: qwenpaw 2.0.1+
  expected_spawn:
    - worker: opskeeper-alerter
      tools: [metric.query, incident.list]
      max_turns: 5
      trigger: "postgres.long_running_tx > 60s"
    - worker: opskeeper-investigator
      tools: [loop.investigate, loop.correlate, postgres.analyze_status, metric.query, knowledge.query]
      max_turns: 40
      trigger: "alerter.completed AND rca 未启动"
    - worker: opskeeper-critic
      tools: [incident.get, metric.query, knowledge.query]
      max_turns: 8
      trigger: "investigator.confidence < 0.6"
    - worker: opskeeper-reviewer
      tools: [incident.get, metric.query]
      max_turns: 5
      trigger: "repair_plan.proposed AND blast_radius ∈ {cluster, tenant_wide}"
    - worker: opskeeper-repairer
      tools: [host.get_load, host.get_processes, host.restart_service]
      max_turns: 15
      trigger: "reviewer.approve AND hitl.approved"
    - worker: opskeeper-verifier
      tools: [recovery.verify, metric.query]
      max_turns: 3
      trigger: "repairer.completed"
  expected_state_progression:
    - detected
    - rca
    - critic_audit
    - review
    - hitl_approval
    - repair_execution
    - verification
    - postmortem
  rubric_addons:
    - state_progression_complete: true
    - worker_spawn_count: 6
    - hitl_path_taken: true     # blast_radius=cluster/tenant_wide 走双签
  notes: |
    与 redis/slow-cmd 的差异：
    - blast_radius=cluster，强制走 HITL 双签（opskeeper-admin + opskeeper-observer）；
    - 修复走 opskeeper 后端 webhook（pg.kill_session），不经 plugin MCP；
    - 长事务检测由 postgres.analyze_status (plugin name) → analyze_database_status (backend)
      完成；plugin 早期声明的 postgres.long_running_tx 已废弃（backend 不暴露）。
