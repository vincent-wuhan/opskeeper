id: k8s/pod-oom
description: 模拟 K8s Pod OOMKilled 导致服务不可用
severity: P1
tags: [k8s, oom, memory]
prerequisites:
  - k8s.cluster reachable
  - k8s.test_namespace exists
inject:
  - type: k8s.inject_memory_pressure
    duration: 300s
    params:
      namespace: test
      deployment: order-svc
      target_memory_mb: 1024
      limit_memory_mb: 512
expect:
  time_to_detect: 60
  time_to_remediate: 180
  root_cause_lines:
    - k8s.pod_list
    - k8s.events
    - k8s.top_pods
    - git-artifact.LinkK8sImage
  remediation_options:
    - k8s.scale
    - k8s.rollout_undo
rubric:
  rca_accuracy: 0.9
  time_to_remediate: 180
  no_collateral_damage: true
metadata:
  owner: "@opskeeper-oncall"
  created_at: "2026-07-13"
