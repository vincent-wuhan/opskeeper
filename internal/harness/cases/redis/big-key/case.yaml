id: redis/big-key
description: 模拟 Redis 大 key（>10MB）导致内存爆
severity: P2
tags: [redis, big-key, memory]
prerequisites:
  - redis.cluster reachable
inject:
  - type: redis.inject_big_key
    duration: 600s
    params:
      key: "test:bigkey:hot"
      size_mb: 50
      type: hash
expect:
  time_to_detect: 120
  time_to_remediate: 300
  root_cause_lines:
    - redis.big_keys
    - redis.memory_usage
    - redis.fragmentation_ratio
  remediation_options:
    - redis.scan_and_delete
rubric:
  rca_accuracy: 0.85
  time_to_remediate: 300
  no_collateral_damage: true
metadata:
  owner: "@opskeeper-oncall"
  created_at: "2026-07-13"
