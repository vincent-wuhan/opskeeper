id: host/cpu-spike
description: 模拟主机 CPU 飙高（>95%）
severity: P2
tags: [host, cpu, performance]
prerequisites:
  - host.test_user_ssh_accessible
  - opskeeper.adapter registered
inject:
  - type: host.cpu_stress
    duration: 300s
    params:
      cores: 4
      target_load: 98
expect:
  time_to_detect: 60
  time_to_remediate: 180
  root_cause_lines:
    - host.host_load
    - host.host_processes
    - host.top_cpu_procs
  remediation_options:
    - host.kill_process
# zero-manual-ops-loop Day 7 task 7.3: rubric 升级 4 指标
# Day 3 协同：recovered phase 调用 verify_recovery 工具的预期形态
rubric:
  rca_accuracy: 0.85
  time_to_remediate: 180
  approval_rate: 1.0
  recovery_pass_rate: 1.0
  no_collateral_damage: true
metadata:
  owner: "@opskeeper-oncall"
  created_at: "2026-07-13"
  # zero-manual-ops-loop Day 3 协同（任务 3.5）：recovered phase 调用
  # verify_recovery 工具的预期形态。harness judge 在 Day 4 接入
  # verify_recovery_score；Day 3 阶段仅文档化 call shape，便于 CPU
  # spike → recovery → verify_recovery(passed) 联动自检。
  verify_recovery:
    call:
      skill_id: "host/cpu-spike"
      resource_type: "host"
      target: "host-injected"
      tolerance: 0.15
      metrics: ["cpu_usage", "mem_usage"]
      baseline_window: "5m"
      compare_window: "2m"
    expectations:
      passed: true
      warning_level: "pass"
      failed_metrics: []
      retry_count: 0
      severity_escalated: false
