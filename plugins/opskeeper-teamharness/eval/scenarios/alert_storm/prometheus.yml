# Prometheus config for alert_storm 剧本
# 注入 50 条 alert（5 个 host × 10 alert/min），验证 alerter dedup。

global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "self"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "fake-saturation"
    # 注入 5 个 host 的 pg connection utilization = 0.97 (≥ 0.95 阈值)
    static_configs:
      - targets: ["fake-host-1:9100", "fake-host-2:9100", "fake-host-3:9100", "fake-host-4:9100", "fake-host-5:9100"]