apiVersion: agentteams.agentteam/v1alpha1
kind: AgentTeamPlugin
metadata:
  name: opskeeper-teamharness
  version: 1.0.75
  description: |
    Opskeeper TeamHarness plugin — provides six deployed ops actors
    (alerter/investigator/reviewer/repairer/verifier/reporter)
    + Manager dispatch decision tree + stdio MCP proxy to opskeeper
    backend /v1/mcp.

    v1.0.1 adds install-plugin HTTP endpoint (POST /api/opskeeper-teamharness/install-plugin)
    so opskeeper Manager can dynamically push new plugin zips to the worker —
    opskeeper itself calls `qwenpaw plugin install <path> --force` as a subprocess.
    Closes the Dashboard-upload → worker-register end-to-end loop without
    requiring Dockerfile changes or worker restart.

    v1.0.2 adds opskeeper-postmortem Worker (RCA → postmortem.md → knowledge vault)
    and the `knowledge.write` plugin-native MCP tool that posts to
    opskeeper /v1/knowledge/docs (pgvector + BM25 dual-index). Without this
    tool postmortem SKILL.md cannot persist its deliverable.

    v1.0.5 adds fail-closed QwenPaw read-only middleware enforcement. Unknown and
    mutating tools are denied before execution; trusted mutating workers must
    explicitly set OPSKEEPER_PERMISSION_MODE=standard.

    v1.0.6 keeps the read-only boundary fail-closed while allowing the AgentTeams
    message coordination primitive, so Manager can dispatch tasks without enabling
    file writes or command execution.

    v1.0.11 terminates the Manager ReAct turn after a successful dispatch and resumes
    only on matching results, new tasks, or admin instructions.

    v1.0.12 fixes dispatch self-locking by recording markers only after the Manager
    message tool successfully sends the task.

    v1.0.13 queues QwenPaw's native pending-stop state directly after a successful
    dispatch so the Manager ends its ReAct turn even when hot-reload did not attach
    the plugin stop handler to an existing workspace.

    v1.0.15 consumes Worker results that carry the required Matrix @manager wake-up
    prefix on the same line as OPSKEEPER_RESULT.

    v1.0.16 ensures result-only messages cannot be mistaken for new tasks through the
    long task-ID fallback while a dispatched marker is pending.

    v1.0.17 also accepts the manager-directed result prefix rendered without the full
    Matrix ID, while prompts continue to require the complete @manager identifier.

    v1.0.18 adds the case-owned PostgreSQL connection-pool exhaustion playbook:
    evidence-bound RCA, reviewer/HITL-gated resize_pool, independent recovery
    verification, and postmortem closure without touching shared PostgreSQL.

    v1.0.19 fixes read-only normalization for postgres.analyze_status, whose
    QwenPaw double-underscore form normalizes every underscore to a dot.

    v1.0.20 aligns postgres.analyze_status with the backend array-based schema
    (db_types/source_ids/device_ids) so PG diagnostics use valid arguments.

    v1.0.21 allows QwenPaw's normalized teamharness.message coordination tool in
    read-only mode without enabling file, shell, browser, or mutating tools.

    v1.0.22 makes the Matrix wake-up address explicit in the Worker result
    contract. Worker final results must address Manager on the same line as
    OPSKEEPER_RESULT so AgentTeams group channels wake the waiting Manager.

    v1.0.23 records the original requesting Matrix room for each dispatched
    task. When a Worker result wakes Manager from a Worker room, TeamHarness
    injects a mandatory OPSKEEPER_COMPLETE relay instruction back to that room.

    v1.0.24 makes the OPSKEEPER_COMPLETE relay deterministic: Manager's plugin
    sends it directly through the Matrix client API when a Worker result wakes a
    cross-room task, with prompt injection retained only as a fallback.

    v1.0.25 records the requesting Matrix room when the administrator task first
    enters Manager, before dispatch middleware runs in a Worker-room context.

    v1.0.26 accepts Markdown-emphasized OPSKEEPER_RESULT protocol lines emitted by
    the Worker runtime, preventing completed results from remaining pending while
    the entry room waits for OPSKEEPER_COMPLETE.

    v1.0.27 accepts Markdown-emphasized Manager mentions and consumes a matching
    result marker across the dispatch/execution session boundary.

    v1.0.28 relays a matching Worker result directly from the PRE_EXECUTE
    request-origin map when dispatch middleware does not leave pending state.

    v1.0.29 gives an explicit OPSKEEPER TASK contract precedence over an embedded
    OPSKEEPER_RESULT instruction, ensuring the entry room is recorded reliably.

    v1.0.30 adds the Dashboard Runtime bypass view and overview readback. It surfaces
    OpsKeeper health, manager version, judge metrics, and recent incidents without
    modifying AgentTeams or Dashboard source.

    v1.0.31 normalizes the OpsKeeper incident-list response shape and aligns all
    runtime plugin version manifests.

    v1.0.32 routes the Dashboard install view through the public Plugin Manager
    endpoint and accepts the plugin-manager tar.gz package format.

    v1.0.33 adds a server-side signed Dashboard RCA proxy, keeping the AgentTeams
    GatewayKey outside the browser while restoring loop.investigate readback. It also
    consolidates diagnostics, Runtime, and plugin management into one OpsKeeper entry.

    v1.0.34 lets the server-side RCA proxy read the QwenPaw mcp/opskeeper credential
    store when the HTTP-router process does not inherit OPSKEEPER_GATEWAY_KEY.

    v1.0.35 sends Dashboard Runtime readback through XMLHttpRequest. Gateways
    in front of AgentTeams must accept both exact and trailing-slash forms of
    the four read-only OpsKeeper proxy paths.

    v1.0.36 deduplicates concurrent Dashboard RCA requests by incident ID,
    preventing duplicate clicks from racing the backend investigation lock.

    v1.0.38 normalizes the OpsKeeper RootCauseJSON display and improves report
    contrast, evidence readability, and Dashboard upgrade cache-busting.

    v1.0.39 closes the PG pool incident loop in read-only mode: approved
    proposal-bound recovery can execute, every stage records audit events, and
    Runtime readback uses the incident API page-size contract.

    v1.0.53 adds the reviewer-only `incident.timeline` plugin-native tool for
    reading the durable business-incident event trail by string incident ID.

    v1.0.54 adds the Dashboard Archive tab. Manager remains the authoritative,
    tenant-isolated source for the sanitized incident evidence chain, while the
    plugin provides read-only integration observability.

    v1.0.55 restores readable muted text in light and dark Dashboard themes and
    prevents the background muted token from being reused as a foreground color.
    It also isolates Manager identity, prompt injection, and continuation state
    from Worker and standalone runtimes, sanitizes outbound thinking, bounds
    reply/message bursts, rejects cross-role targets, and adds an admin incident
    STOP circuit breaker.

    v1.0.56 adds a read-only room-to-plugin integration preflight. It checks
    Dashboard session state, Matrix room membership, AgentTeams and OpsKeeper
    health, TeamHarness Worker loading, and Dashboard manifest consistency
    without sending messages or changing runtime state.

    v1.0.57 increases plugin-list secondary text contrast with the adaptive
    foreground token and a bounded opacity instead of low-contrast muted gray.

    v1.0.58 scopes high-contrast text to all TeamHarness Dashboard surfaces and
    restores safe runtime credential fallbacks for the signed RCA proxy.

    v1.0.65 aligns the Manager wire contract, persists a real baseline row,
    and projects candidate-repair comparison readback from the Manager archive
    with the controlled fixed-workload approval gate in RCA.

    v1.0.66 validates the combined final-demo chain, including authoritative
    Matrix workflow events, business impact, proposal-bound repair, Archive
    evidence, and the 4/4-to-8 PostgreSQL pool capacity contract.

    v1.0.69 binds final-demo approvals to the current Matrix message, ignoring
    stale incident IDs from accumulated room history.
    v1.0.70 retries transient OpsKeeper 5xx responses after human approval.
    v1.0.71 infers the PostgreSQL RCA resource type when the archive
    evidence omits it, downgrades a worker/manifest trail version mismatch
    to a warning instead of blocking the run, and repoints the MCP name
    map and the harness self-check at the core/ layout after the internal
    -> core module move.
    v1.0.72 re-aligns the plugin version with the current release boundary:
    the accompanying backend change is the LLM gateway streaming
    delta.tool_calls fix, which lives in the Go tree and does not alter this
    plugin's runtime behaviour. No runtime change in this release.
    v1.0.73 re-aligns the plugin version with the release boundary. The
    accompanying backend change is the node agent plugin tool result fix,
    which lives in the Go tree and does not alter this plugin's runtime
    behaviour. No runtime change in this release.
    v1.0.74 re-aligns the plugin version with the release boundary. The
    accompanying backend change is the node-side process ranking, which lives
    in the Go tree and does not alter this plugin's runtime behaviour. No
    runtime change in this release.
    v1.0.75 re-aligns the plugin version with the release boundary. The
    accompanying backend change is the bounded node-side file inventory,
    which lives in the Go tree and does not alter this plugin's runtime
    behaviour. No runtime change in this release.
    v1.0.68 preserves the human Matrix approval boundary and forwards approved
    final-demo incidents to a deterministic Manager recovery API, avoiding
    quota-sensitive LLM retries after the operator has already approved. It
    extends the scenario window and archives the complete evidence chain.

    v1.0.60 adds a Manager archive index so the Dashboard Archive tab lists
    actual closed-loop incident IDs instead of numeric alert IDs, and clarifies
    when an alert has no archived evidence chain.

    v1.0.59 projects OpsKeeper workflow stages into Matrix as
    `agentteams.workflow` events, enabling Element notices and AgentTeams
    Dashboard task-board progression without changing host applications.

    v1.0.7 adds a plugin-native Manager continuation gate: dispatched task markers
    wait for matching Worker results, while empty/self continuations are skipped.

prompts:
  team: prompts/team/OPSKEEPER-TEAMS.md
  agent:
    leader: prompts/agent/leader.md
    worker: prompts/agent/worker.md
    remoteMember: prompts/agent/remote-member.md
  manager:
    agents: prompts/manager/AGENTS.md
    tools: prompts/manager/TOOLS.md
    heartbeat: prompts/manager/HEARTBEAT.md

skills:
  agent:
    - id: opskeeper-alerter
      path: skills/agent/opskeeper-alerter
      roles: [worker]
    - id: opskeeper-investigator
      path: skills/agent/opskeeper-investigator
      roles: [worker]
    - id: opskeeper-critic
      path: skills/agent/opskeeper-critic
      roles: [worker]
    - id: opskeeper-reviewer
      path: skills/agent/opskeeper-reviewer
      roles: [worker]
    - id: opskeeper-repairer
      path: skills/agent/opskeeper-repairer
      roles: [worker]
    - id: opskeeper-verifier
      path: skills/agent/opskeeper-verifier
      roles: [worker]
    - id: opskeeper-postmortem
      path: skills/agent/opskeeper-postmortem
      roles: [worker]
  team:
    - id: opskeeper-coordination
      path: skills/team/opskeeper-coordination
      roles: [manager]

mcp:
  servers:
    - id: opskeeper
      transport: stdio
      command: python
      args:
        - mcp/server.py
      tools:
        - loop.investigate
        - loop.correlate
        - recovery.verify
        - recovery.execute
        - metric.query
        - incident.list
        - incident.get
        - postgres.analyze_status
        - host.get_load
        - host.get_processes
        - host.restart_service
        - knowledge.query
        - knowledge.write
        - hitl.decide
        - incident.record
        - incident.timeline

adapters:
  - id: qwenpaw
    path: adapters/qwenpaw
  - id: claude-code
    path: adapters/claude-code

package:
  include:
    - plugin.yaml
    - prompts/
    - skills/
    - mcp/
    - adapters/
    - scripts/
    - loongsuite/
    - examples/
    - README.md
    - CHANGELOG.md
    - dashboard/

# Dashboard 插件双 manifest 单包（生态兼容字段）
# 同一插件包同时携带 plugin.yaml (AgentTeams) + dashboard/plugin.json (Dashboard)
# AgentTeams runtime 只读 plugin.yaml；Dashboard runtime 只读 dashboard/plugin.json
# 两者互不 import，共享 opskeeper backend HTTP API
# opskeeper-install: replace
