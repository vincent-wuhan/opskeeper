name: opskeeper-postmortem
version: 1.0.0
description: 事故复盘 worker
inputs:
  incident_id:
    type: string
    required: true
  root_cause_json:
    type: object
    required: true
  verified_delta:
    type: object
    required: true
outputs:
  postmortem_doc_id:
    type: string
    required: true
  action_items:
    type: array
    required: true
sample_inputs:
  - incident_id: inc-001
    root_cause_json: {root_cause: "pg-conn-pool-saturation"}
    verified_delta: {pass: true}
est_cost_tokens: 3000
blast_radius_default: cluster
safety_level_default: L0
artifacts:
  skill_md_path: skills/agent/opskeeper-postmortem/SKILL.md