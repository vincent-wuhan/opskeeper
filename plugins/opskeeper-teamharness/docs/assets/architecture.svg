<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" font-family="Inter, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a4a5e"/>
    </marker>
    <linearGradient id="mgr" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#3a4a5e"/>
      <stop offset="1" stop-color="#27384e"/>
    </linearGradient>
    <linearGradient id="wkr" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#5185c2"/>
      <stop offset="1" stop-color="#3965a3"/>
    </linearGradient>
    <linearGradient id="audit" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#bfa740"/>
      <stop offset="1" stop-color="#8e7b22"/>
    </linearGradient>
  </defs>

  <rect width="1100" height="720" fill="#fbfbfd"/>

  <text x="550" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">
    opskeeper-teamharness · Agent Infra 架构图
  </text>
  <text x="550" y="58" text-anchor="middle" font-size="13" fill="#475569">
    7 Worker Skill · L0–L3 Safety Ladder · Nacos Skill Registry · Append-Only Audit Ledger · OTel/LoongSuite 可观测
  </text>

  <!-- Manager -->
  <rect x="430" y="90" width="240" height="64" rx="10" fill="url(#mgr)" stroke="#1d2a3d"/>
  <text x="550" y="116" text-anchor="middle" fill="#fff" font-size="16" font-weight="600">Manager（agentteams）</text>
  <text x="550" y="138" text-anchor="middle" fill="#cdd6e3" font-size="12">决策表 + Safety Level 解析</text>

  <!-- Workers row 1 -->
  <g>
    <rect x="80" y="200" width="135" height="58" rx="8" fill="url(#wkr)" stroke="#2f5687"/>
    <text x="147" y="226" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">alerter</text>
    <text x="147" y="246" text-anchor="middle" fill="#dde6f3" font-size="11">L0 · 告警聚合</text>

    <rect x="240" y="200" width="135" height="58" rx="8" fill="url(#wkr)" stroke="#2f5687"/>
    <text x="307" y="226" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">investigator</text>
    <text x="307" y="246" text-anchor="middle" fill="#dde6f3" font-size="11">L0 · 根因诊断</text>

    <rect x="400" y="200" width="135" height="58" rx="8" fill="url(#wkr)" stroke="#2f5687"/>
    <text x="467" y="226" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">critic</text>
    <text x="467" y="246" text-anchor="middle" fill="#dde6f3" font-size="11">L0 · 后置审计</text>

    <rect x="560" y="200" width="135" height="58" rx="8" fill="url(#wkr)" stroke="#2f5687"/>
    <text x="627" y="226" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">reviewer</text>
    <text x="627" y="246" text-anchor="middle" fill="#dde6f3" font-size="11">L2 · 方案审批</text>

    <rect x="720" y="200" width="135" height="58" rx="8" fill="url(#wkr)" stroke="#2f5687"/>
    <text x="787" y="226" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">repairer</text>
    <text x="787" y="246" text-anchor="middle" fill="#dde6f3" font-size="11">L1/L2 · 修复</text>

    <rect x="880" y="200" width="135" height="58" rx="8" fill="url(#wkr)" stroke="#2f5687"/>
    <text x="947" y="226" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">verifier</text>
    <text x="947" y="246" text-anchor="middle" fill="#dde6f3" font-size="11">L0 · 恢复验证</text>
  </g>

  <!-- postmortem -->
  <rect x="480" y="300" width="135" height="58" rx="8" fill="url(#wkr)" stroke="#2f5687"/>
  <text x="547" y="326" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">postmortem</text>
  <text x="547" y="346" text-anchor="middle" fill="#dde6f3" font-size="11">L0 · 复盘 + 反哺 KB</text>

  <!-- HITL -->
  <rect x="400" y="395" width="300" height="50" rx="8" fill="#e9d8fd" stroke="#7c3aed"/>
  <text x="550" y="418" text-anchor="middle" fill="#5b21b6" font-size="13" font-weight="600">HITL 双签（仅 L2）</text>
  <text x="550" y="436" text-anchor="middle" fill="#6d28d9" font-size="11">opskeeper-admin + opskeeper-observer</text>

  <!-- Backend -->
  <rect x="80" y="490" width="280" height="68" rx="8" fill="#e3eafc" stroke="#3965a3"/>
  <text x="220" y="514" text-anchor="middle" fill="#1d2a3d" font-size="13" font-weight="600">opskeeper backend</text>
  <text x="220" y="532" text-anchor="middle" fill="#475569" font-size="11">/v1/mcp · /v1/hitl · /v1/state</text>
  <text x="220" y="548" text-anchor="middle" fill="#475569" font-size="11">/v1/knowledge · /v1/audit</text>

  <!-- MCP stdio proxy -->
  <rect x="400" y="490" width="280" height="68" rx="8" fill="#fef3c7" stroke="#bfa740"/>
  <text x="540" y="514" text-anchor="middle" fill="#1f2937" font-size="13" font-weight="600">stdio MCP proxy</text>
  <text x="540" y="532" text-anchor="middle" fill="#475569" font-size="11">plugin stdio MCP server</text>
  <text x="540" y="548" text-anchor="middle" fill="#475569" font-size="11">Bearer + HMAC + traceparent</text>

  <!-- Skill registry -->
  <rect x="720" y="490" width="280" height="68" rx="8" fill="#d1fae5" stroke="#0f766e"/>
  <text x="860" y="514" text-anchor="middle" fill="#0f3b34" font-size="13" font-weight="600">Skill Registry</text>
  <text x="860" y="532" text-anchor="middle" fill="#475569" font-size="11">Nacos Config · 本地 fallback</text>
  <text x="860" y="548" text-anchor="middle" fill="#475569" font-size="11">30s polling · 热加载</text>

  <!-- Audit ledger -->
  <rect x="80" y="600" width="600" height="60" rx="8" fill="url(#audit)" stroke="#6f5c1d"/>
  <text x="380" y="624" text-anchor="middle" fill="#1f2937" font-size="13" font-weight="600">Append-Only Audit Ledger</text>
  <text x="380" y="644" text-anchor="middle" fill="#3f3310" font-size="11">HMAC chain hash · 每日 ndjson · Nacos 历史版本同步</text>

  <!-- Observability -->
  <rect x="720" y="600" width="280" height="60" rx="8" fill="#fde7d2" stroke="#c2410c"/>
  <text x="860" y="624" text-anchor="middle" fill="#7c2d12" font-size="13" font-weight="600">可观测</text>
  <text x="860" y="644" text-anchor="middle" fill="#7c2d12" font-size="11">OTel · Loki · Tempo · AgentLoop</text>

  <!-- Arrows -->
  <line x1="550" y1="154" x2="550" y2="195" stroke="#3a4a5e" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="947" y1="258" x2="547" y2="295" stroke="#3a4a5e" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="787" y1="258" x2="550" y2="395" stroke="#3a4a5e" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="627" y1="258" x2="550" y2="395" stroke="#3a4a5e" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="540" y1="490" x2="220" y2="490" stroke="#3965a3" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="680" y1="524" x2="720" y2="524" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="220" y1="558" x2="220" y2="600" stroke="#6f5c1d" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="540" y1="558" x2="540" y2="600" stroke="#6f5c1d" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="860" y1="558" x2="860" y2="600" stroke="#c2410c" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <rect x="80" y="678" width="920" height="32" rx="6" fill="#fff" stroke="#cbd5e1"/>
  <text x="100" y="699" fill="#1f2937" font-size="12">
    <tspan font-weight="600">色块：</tspan>
    <tspan fill="#3a4a5e">■ Manager</tspan>
    <tspan fill="#3965a3">  ■ Worker Skill</tspan>
    <tspan fill="#7c3aed">  ■ HITL</tspan>
    <tspan fill="#3965a3">  ■ opskeeper backend</tspan>
    <tspan fill="#bfa740">  ■ plugin stdio MCP</tspan>
    <tspan fill="#0f766e">  ■ Skill Registry</tspan>
    <tspan fill="#6f5c1d">  ■ Audit Ledger</tspan>
    <tspan fill="#c2410c">  ■ 可观测</tspan>
  </text>
</svg>